name: Deploy

on:
  workflow_dispatch:
  # After the VPS has the repo and the SSH_PRIVATE_KEY secret is set,
  # uncomment this block to deploy on every push to main.
  # Optional repository variables SSH_HOST and SSH_USER override the defaults.
  # push:
  #   branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy frontend
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ vars.SSH_HOST || '172.233.186.139' }}
      SSH_USER: ${{ vars.SSH_USER || 'root' }}

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" <<'EOF'
            cd ~/documents/projects/billetera/frontend
            ./deploy.sh
          EOF
